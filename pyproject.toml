[project]
name = "mini-jira"
version = "0.1.0"
description = "A small PostgreSQL-backed issue tracker for autonomous agent exercises"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "sqlalchemy>=2.0.44,<2.1",
  "psycopg[binary]>=3.2.12,<4",
  "alembic>=1.17,<2",
  "pydantic-settings>=2.11,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx2", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
